name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Format, Type Check & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # SonarQube Cloud blames every line to decide what counts as new code;
          # a depth-1 checkout leaves it with no history to blame against.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint
        run: pnpm run lint

      - name: Format Check
        run: pnpm run format:check

      - name: Type Check
        run: pnpm run check-types

      - name: Unit Tests
        run: pnpm run test:coverage

      - name: SonarQube Cloud Scan
        # Forks cannot read the secret, so skip rather than fail their PRs.
        # `secrets` is not a valid context in `if`, hence the job-level env.
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8

      - name: Build Studio
        # apps/web is built by Vercel on every PR; apps/studio is not, so a
        # dependency that breaks `sanity build` would otherwise merge green.
        # The example values are placeholders, enough for a build.
        run: |
          cp apps/studio/.env.example apps/studio/.env
          pnpm turbo run build --filter=studio
